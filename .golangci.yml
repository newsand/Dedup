run:
  timeout: 3m

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - goimports
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

linters-settings:
  goimports:
    local-prefixes: deduplicator

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
